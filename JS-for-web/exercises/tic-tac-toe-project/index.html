<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe project</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .container {
            --sqr-size: 70px;
            display: grid;
            grid-template-columns: repeat(3, var(--sqr-size));
            grid-template-rows: repeat(3, var(--sqr-size));
            gap: 1px;
        }

        .container>div {
            outline: black 1px solid;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container>div:not(.selected):hover {
            background: cadetblue;
        }

        .container>div svg {
            width: 50px;
            height: 50px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="1"></div>
        <div id="2"></div>
        <div id="3"></div>
        <div id="4"></div>
        <div id="5"></div>
        <div id="6"></div>
        <div id="7"></div>
        <div id="8"></div>
        <div id="9"></div>
    </div>
    <p id="disp--winner"></p>
    <button id="btn--reset">Reset</button>

    <script src="game-logic.js"></script>

    <script>
        // Handle DOM nodes
        const startGame = () => {
            // Reset game
            const game = installLogic();
            const sqrs = document.querySelectorAll('.container>div');
            const winnerDisplay = document.getElementById('disp--winner');
            
            winnerDisplay.textContent = '';
            sqrs.forEach((sqr) => {
                sqr.innerHTML = '';
                sqr.removeAttribute('class');
            });


            // Create players
            const p1 = game.createPlayer(1);
            const p2 = game.createPlayer(2);


            sqrs.forEach((sqr) => {
                sqr.onclick = () => {
                    const isP1Turn = game.showGame('turn') % 2 === 0;
                    if (game.showGame('winner') === undefined) {
                        if (isP1Turn) {
                            // HTML-to-JS BUG:
                            // Read git log: Begin connecting game logic to DOM handler 
                            p1.makeMove(Number(sqr.id));
                            markSqr(sqr, isP1Turn);
                        } else {
                            p2.makeMove(Number(sqr.id));
                            markSqr(sqr, isP1Turn);
                        }
                    } 
                    if (game.showGame('winner')) {
                        winnerDisplay.textContent = `${game.showGame('winner')} wins!`; 
                    }
                };
            });
            

            function markSqr(sqr, isP1Turn) {
                if (sqr.classList.length == 0) {
                    if (isP1Turn) {
                        sqr.classList.add('selP1');
                        sqr.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>window-close</title><path d="M13.46,12L19,17.54V19H17.54L12,13.46L6.46,19H5V17.54L10.54,12L5,6.46V5H6.46L12,10.54L17.54,5H19V6.46L13.46,12Z" /></svg>';
                    } else {
                        sqr.classList.add('selP2');
                        sqr.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>checkbox-blank-circle-outline</title><path d="M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z" /></svg>';
                    }
                }
            }
        };

        startGame();
    </script>

    <script>
        const resetButton = document.getElementById('btn--reset');
        resetButton.onclick = startGame;
    </script>
</body>

</html>
