    <style>
        body {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .container {
            --sqr-size: 70px;
            display: grid;
            grid-template-columns: repeat(3, var(--sqr-size));
            grid-template-rows: repeat(3, var(--sqr-size));
            gap: 1px;
        }

        .container>div {
            outline: black 1px solid;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container>div:not(.selected):hover {
            background: cadetblue;
        }

        .container>div.selected::after {
            content: 'x';
        }
    </style>
</head>
