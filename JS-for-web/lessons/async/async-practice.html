<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async practice</title>
    <script type="module">
        import { giphyKey } from '../apis/apikeys.js';
        const img = document.querySelector('img');
        const url = `https://api.giphy.com/v1/stickers/search?api_key=${giphyKey}&q=hello&limit=1&offset=0&rating=g&lang=en&bundle=low_bandwidth`;

        (async () => {
            try {
                const response = await fetch(url);
                const promise = await response.json();
                const src = await promise.data[0].images.original.url;
                img.src = await src;
            } catch (err) {
                throw new Error('promise rejected');
            }  
        })();
        // much cleaner and easier to read
    </script>
</head>
<body>
    <img src="" alt="">
</body>
</html>
