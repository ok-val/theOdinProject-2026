<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Loader </title>

    <script type="module">
        import { giphyKey } from './apikeys.js';
        const img = document.querySelector('img');
        const url = `https://api.giphy.com/v1/stickers/search?api_key=${giphyKey}&q=hello&limit=1&offset=0&rating=g&lang=en&bundle=low_bandwidth`;
        fetch(url)
            .then(response => {
                console.log(response.__proto__);
                return response.json();
            })
            .then(res => {
                // console.log(res.data[0].images.original.url);
                // console.log(JSON.stringify(res.data));
                img.src = res.data[0].images.original.url;
            })
            .catch(err => console.error(err));
    </script>
</head>
<body>
    <img src="" alt="">
</body>
</html>
