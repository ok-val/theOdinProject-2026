<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing</title>
    <style>
        /* Consider a CSS Reset */
        * { 
            margin: 0;
            padding: 0;
            /* box-sizing default value is content-box */
            box-sizing: border-box; 
            /* in essence, which box model are we sizing? Content box or Border box */
            background-color: #f9cc9d;
        }
        
        div {
            background-color: #c4dfb8;
            /* border: #ffeebc solid 24px; */
            padding: 50px;
            margin: 10px;
        }
        
        .box-1 {
            box-sizing: border-box; 
            /* border-box option defines the border-box size */
            /* keep the total size within the predefined width and height */
            width: 400px; /* border-box-width = 400px */
            height: 300px; /* border-box-height = 300px */
        }
        
        .box-2 {
            box-sizing: content-box; 
            /* content-box option defines the content-box size */
            width: 400px; /* content-box-width = 400px*/
            height: 300px; /* content-box-width = 300px*/
        }
    </style>
</head>

<body>
    <div class="box-1">Border-box</div>
    <div class="box-2">Content-box</div>
</body>

</html>
