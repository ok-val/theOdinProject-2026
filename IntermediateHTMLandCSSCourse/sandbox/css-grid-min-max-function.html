<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced grid properties</title>
    <style>
        .grid-container {
            resize: both;
            overflow: auto;
            
            padding: 4px;
            border: 1px solid grey;
            background-color: skyblue;

            display: grid;
            gap: 4px;
            grid-template-rows: repeat(2, min(200px, 50%));
            /* min() chooses between 200px and 50% of the container's available space, whichever smaller */
            grid-template-columns: repeat(5, max(120px, 15%));
            /* min() chooses between 120px and 15% of the container's available space, whichever larger */
        }

        .grid-item {
            background-color: #444;
            text-align: center;
            color: #ddd;
            font-family: sans-serif;
            font-size: 1.5rem;
            padding: 12px;
        }

        p {
            margin: 12px auto 24px;
        }

        img {
            height: 60px;
        }
    </style>
</head>

<body>
    <div class="grid-container">
        <div class="grid-item">
            <p>Odin 1</p>
            <img src="https://www.theodinproject.com/mstile-70x70.png" alt="top logo" />
        </div>
        <div class="grid-item">
