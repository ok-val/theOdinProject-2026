<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG polygons</title>
    <style>
        body {
            height: auto;
            font-size: 24pt;
            background: hsl(210deg 15% 6%);
            color: white;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            height: 100vh;
        }

        p {
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        svg {
            /* display: block; */
            fill: transparent;
            stroke: hotpink;
            stroke-width: 5px;
            outline: 1px solid hsl(210deg 15% 30%);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <p>A polygon is drawn using connected points as xy coords</p>
        <svg width="300" height="300">
            <polygon points="
      60,100
      100,180
      140,140
      180,180
      220,100
    " />
        </svg>

        <p>This is confusing because you would expect polygons to be side-counted.</p>
        <p>But NOOO, the mf at SVG decided and still believes that you should just provide coords.</p>
        <p>How convenient!</p>
    </div>
</body>

</html>
