<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="positioning.css">
</head>

<body>
    <div class="card-container">
        <!-- Absolute positioning example -->
        <!-- Displaying text at the default spot -->
        <img class="card-image" src="https://picsum.photos/450/450">
        <div class="card-body">
            <div class="card-heading">This is a cool heading!</div>
            <p class="card-paragraph">This is some cool placeholder text!</p>
        </div>
    </div>

    <div class="rel-parent">
        <p>The parent is positioned as relative.</p>
        <div class="abs-child">
            <p>The child is set to absolute position and will be bound to the relative parent.</p>
        </div>
    </div>

</body>

</html>
