<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced grid properties</title>
    <style>
        .grid-container {
            /* resize enable resizing */
            resize: both;
            /* overflow: auto enable scrolling if container is smaller than grid */
            overflow: auto;
            /* Note that css automatically implement a breakpoint beyond a certain size threshold (when the items are shrunk to a certain point). This is controlled by the property min-content. */
            
            padding: 4px;
            border: 1px solid grey;
            background-color: skyblue;

            /* grid settings */
            display: grid;
            gap: 4px;

            /* fr is the fractional unit */
            /* fr unit equally divides the available space on the main or cross axes */
            grid-template-rows: repeat(2, 1fr);
            grid-template-columns: repeat(2, 1fr) repeat(3, 2fr);
        }

        .grid-item {
            background-color: #444;
            text-align: center;
            color: #ddd;
            font-family: sans-serif;
            font-size: 1.5rem;
            padding: 12px;
        }

        p {
            margin: 12px auto 24px;
        }

        img {
            height: 60px;
        }
    </style>
</head>

<body>
    <div class="grid-container">
        <div class="grid-item">
            <p>Odin 1</p>
            <img src="https://www.theodinproject.com/mstile-70x70.png" alt="top logo" />
        </div>
