<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid template areas </title>
    <style>
        .item-a {
            grid-area: header;
        }

        .item-b {
            grid-area: main;
        }

        .item-c {
            grid-area: sidebar;
        }

        .item-d {
            grid-area: footer;
        }

        .container {
            display: grid;
            grid-template-columns: 50px 50px 50px 50px;
            grid-template-rows: auto;
            gap: 20px;
            grid-template-areas:
                "header header header header"
                "main main . sidebar"
                "footer footer footer footer";
        }

        .container > div {
            outline: 1px solid blue;
        }
    </style>
</head>

<body>
    <h3>Grid template area</h3>
    <p>The grid-template-areas property allows me to declare the grid template by referencing the declared names using `grid-area` property.</p>
    <p>Because this property refers to a set of predefined grid-area names, the grid-area must be declared first.</p>
    <div class="container">
        <div class="item-a">Header</div>
        <div class="item-b">Main</div>
        <div class="item-c">Sidebar</div>
        <div class="item-d">Footer</div>
    </div>
</body>

</html>
