<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG line</title>
    <style>
        body {
            height: auto;
            font-size: 24pt;
            background: hsl(210deg 15% 6%);
            color: white;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            height: 100vh;
        }

        p {
            margin: 0;
            padding: 20px;
        }

        svg {
            /* display: block; */
            outline: 1px solid hsl(210deg 15% 30%);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <p>Draw a line by defining the starting and ending x,y coords</p>
        <svg width="300" height="300">
            <line x1="90" y1="80" x2="180" y2="250" stroke="hotpink" stroke-width="5" />
        </svg>
    </div>
</body>

</html>
