<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid gaps</title>
    <style>
        .grid-1 div {
            border: 1px solid blue;
        }

        .grid-1 {
            display: grid;
            grid-template-columns: 50px 50px;
            grid-template-rows: 50px 50px;
            grid-auto-flow: row;
            grid-auto-rows: 50px;
            grid-auto-columns: 50px;

            column-gap: 15px;
            row-gap: 5px;
            /* gap: 10px; */
        }
    </style>
</head>

<body>
    <h3>Grid gap control</h3>
    <p>The gap between grid rows and columns is known as the <em>gutter or alley</em>.</p>
    <p>I can control the gaps between columns or rows or both using column-gap, row-gap, and row respectively.</p>

    <div class="grid-1">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>
        <div>Item 7</div>
        <div>Item 8</div>
    </div>

</body>

</html>
