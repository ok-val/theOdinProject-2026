<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG rectangles</title>
    <style>
        body {
            height: auto;
            font-size: 24pt;
            background: hsl(210deg 15% 6%);
            color: white;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            height: 100vh;
        }

        p {
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        svg {
            /* display: block; */
            outline: 1px solid hsl(210deg 15% 30%);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <p>Here's a rectangle</p>
        <svg width="300" height="300">
            <rect x="30" y="40" width="160" height="220" stroke="hotpink" stroke-width="5" />
        </svg>
        <p>A rectangle is drawn from the top-left corner, followed by height and width attributes</p>
        <p><strong>Width/Height='0'</strong> will result in <em>nothingness</em>...</p>
        <p>The rectangle's corners could also be rounded (all four at once)</p>
        <svg width="300" height="300">
            <rect x="30" y="40" rx="40" ry="20" width="160" height="220" stroke="hotpink" stroke-width="5" />
        </svg>
    </div>
</body>

</html>
