<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG circle and ellipses</title>
    <style>
        body {
            height: auto;
            font-size: 24pt;
            background: hsl(210deg 15% 6%);
            color: white;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            height: 100vh;
        }

        p {
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        svg {
            /* display: block; */
            fill: transparent;
            stroke: hotpink;
            stroke-width: 5px;
            outline: 1px solid hsl(210deg 15% 30%);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <p>Circles are drawn from the center coords (cx, cy), with one radius.</p>
        <svg width="300" height="300">
            <circle cx="150" cy="150" r="50"/>
        </svg>

        <p>Ellipses are drawn from the center coords (cy, cx), with two radii instead of one.</p>
        <svg width="300" height="300">
            <ellipse cx="150" cy="150" rx="70" ry="30"/>
        </svg>
    </div>
</body>

</html>
