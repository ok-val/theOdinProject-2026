<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button types</title>
</head>
<body>
    <h3>Button types</h3>
    <p>So far, I have been using the submit button type to submit forms. <br>
        By default, if type is not specified, the button type is set to submit. <br>
        Here are two more button types that I should know: </p>

    <ul>
        <!-- The reset button type resets the input fields back to their original states. -->
        <li><button type="reset">Reset</button></li>
        <!-- The generic button type is used with JS for anything that is not form-related -->
        <li><button type="button">Generic</button></li>
    </ul>
</body>
</html>
