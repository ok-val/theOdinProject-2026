<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="btn">Click to turn me Blue</button>

    <script>

        const switchColor = {
            isPink: true,

            switch: () => {
                if (this.isPink) {
                    this.isPink = false;
                    return '#a8dadc';
                } else {
                    this.isPink = true;
                    return '#ffc8dd';
                }
            },
        }

        
        const btn = document.getElementById("btn");
        btn.addEventListener("click", function (e) {
            e.target.style.background = switchColor.switch();
        });
    </script>
</body>

</html>
