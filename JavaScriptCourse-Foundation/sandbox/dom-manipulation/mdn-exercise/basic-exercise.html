<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple DOM example</title>
</head>



<body>
    <section>
        <img src="dinosaur.png"
            alt="A red Tyrannosaurus Rex: A two legged dinosaur standing upright like a human, with small arms, and a large head with lots of sharp teeth.">
        <p>Here we will add a link to the <a href="https://www.mozilla.org/">Mozilla homepage</a></p>
    </section>
    <script>
        const link = document.querySelector('a');
        link.textContent = "Mozilla Dev Network";
        link.setAttribute('href', "https://developer.mozilla.org");

        const section = document.querySelector('section'); // select the parent
        const newP1 = document.createElement('p'); // create a new element
        newP1.textContent = "My name is Jeff. (Parent) ";  // adjust the new element to taste
        section.appendChild(newP1);   // add the new element

        // This is how you can quickly append texts to EXISTING elements 
        const babyP1 = document.createTextNode('Are you for real? (child)');
        newP1.appendChild(babyP1);
        newP1.removeChild(babyP1); // :( --- my baby

        newP1.appendChild(babyP1); // alright chill 
        babyP1.remove() // --- MAH BABY
        
        newP1.appendChild(babyP1); // CHILL 


    </script>
</body>

</html>
