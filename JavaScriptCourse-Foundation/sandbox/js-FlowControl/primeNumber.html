<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Number</title>
</head>

<body>
    <script>
        let prime = [];
        for (let i = 10; i >= 2; i--) {
            // when in doubt, use stand-in conditionals
            let isPrime = true;
            for (let n = i - 1; n >= 2; n--) {
                if (i % n == 0) isPrime = false; 
            }
            if (isPrime) prime.push(i); 
        }
    </script>
    <script>
        let prime1 = []; 

        // create a counter for every number starting from 2
        outer: for (let i = 2; i <= 20; i++) {
            // create an inner incremental checker for divisibility
            for (let n = 2; n < i; n++) {   // condition returns False at first iteration
                // if we find a divisible condition, skip current iteration of n and i
                if (i % n == 0) continue outer;
            }
            // after no divisibility found, add to prime
            prime1.push(i);
        }
    </script>
</body>

</html>
