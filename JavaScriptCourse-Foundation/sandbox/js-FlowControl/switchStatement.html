<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Statements</title>
    <link rel="stylesheet" href="switchStatement.css">
</head>
<body>
    <label for="switch-theme">Choose a theme</label>
    <select id="switch-theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
    </select>
    <div class="apply-theme">
        This is the <span id="state-theme">Light</span> theme.
    </div>

    <script src="switchStatement.js"></script>
</body>
</html>
