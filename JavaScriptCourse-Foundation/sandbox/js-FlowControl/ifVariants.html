<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Statement Variants</title>
</head>

<body>
    <script>
        // Given this function 
        function checkAge(age) {
            if (age > 18) {
                return true;
            } else {
                return confirm('Did parents allow you?');
            }
        }

        /**
         * Exercise 1: Rewrite the same function using question mark operator `?`
        */
        function checkAge_ques(age) {
            /**
             * @returns {boolean} age > 18 ? true : false;
            */
            return (age > 18) ? true : confirm('Did parents allow you?');
        }

        /**
         * Exercise 2: Rewrite the same function using OR `||`
        */
        function checkAge_or(age) {
            /**
             * @returns {boolean} age > 18 ? true : false;
            */
            return (age > 18) || confirm('Did parents allow you?');
        }
    </script>
</body>

</html>
