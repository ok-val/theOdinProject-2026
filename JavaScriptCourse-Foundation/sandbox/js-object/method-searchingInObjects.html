<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Array Cardio 💪💪</title>
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>
    <p><em>Psst: have a look at the JavaScript Console</em> 💁</p>
    <script>
        // ## Array Cardio Day 2

        const people = [
            { name: 'Wes', year: 1988 },
            { name: 'Kait', year: 1986 },
            { name: 'Irv', year: 1970 },
            { name: 'Lux', year: 2015 }
        ];

        const comments = [
            { text: 'Love this!', id: 523423 },
            { text: 'Super good', id: 823423 },
            { text: 'You are the best', id: 2039842 },
            { text: 'Ramen is my fav food ever', id: 123523 },
            { text: 'Nice Nice Nice!', id: 542328 }
        ];

        // Some and Every Checks
        // Array.prototype.some() // is at least one person 19 or older?
        console.log(people.some((person) => (2026 - person.year) >= 19));
        
        // Array.prototype.every() // is everyone 19 or older?
        console.log(people.every((person) => (2026 - person.year) >= 19));


        // Array.prototype.find()
        // Find is like filter, but instead returns just the one you are looking for
        // find the comment with the ID of 823423
        let searchRes = comments.find((comment) => comment.id === 823423);
        console.log(searchRes);
        console.log(searchRes === comments[1]); // => true, meaning that find() creates a reference to the original. Do alterations affect data both ways? Answer: Yes! See below

        comments[1].id = 123456; // changes made to original
        console.log(searchRes);
        console.log(searchRes === comments[1]); // => true, both objects' ids have been updated, the reference is still live
        
        searchRes.id = 456789;   // changes made to reference
        console.log(searchRes);
        console.log(searchRes === comments[1]); // => true, making changes to the referencer has also updated the original


        // Array.prototype.findIndex()
        // Find the comment with this ID
        // delete the comment with the ID of 542328
        delete comments[comments.findIndex((comment) => comment.id === 542328)];
        
        // notice that the object's length remains the same
        // The member's key-value has been removed but its placeholder still stands
        comments.splice((comments.findIndex((comment) => comment === undefined)), 1);

        console.log(comments);

    </script>
</body>

</html>
