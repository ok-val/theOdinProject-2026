<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Functions</title>
</head>

<body>
    <script>
        /**
         * ARROW Functions 
         * We have seen arrow function in [[function-anonymous]] a little bit
         * To review, this is how it's constructed: 
        */
        let arrow_sum = (a, b) => {
            return a + b;
        };
        console.log(arrow_sum(3,4));

        // For simple function expressions, you could even go shorter
        let arrow_double = x => x * 2;  // ignoring the curly brackets
        console.log(arrow_double(4));
        
    </script>
</body>

</html>
