<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Functions</title>
    <style>
        :root {
            background-color: #a8dadc;
        }
        button {
            font-size: 3rem;
        }
    </style>
</head>

<body>
    <button id="try_me_button">Try me</button>
    <button id="try_me_button2">Try again</button>
    <script>
        /**
         * ANONYMOUS FUNCTIONS are functions with no name
         * ARROW FUNCTIONS are similar to anonymous ones, just slightly different syntax
         * So this is similar to Python's lambda
        */

        // This one is similar to lambda : print("Sneaky")
        (function () {
            alert("Sneaky");
        });

        // This one takes one variable
        (function (x) {
            alert(`${x} is a parameter`);
        })

        // ANONYMOUS functions are useful for defining functions on the fly
        const try_me_button = document.getElementById("try_me_button");
        try_me_button.addEventListener("click", function () {
            alert("Message generated by an ANONYMOUS function.");
        })

        // ARROW functions are similar to anonymous functions, just written differently
        const try_me_button2 = document.getElementById("try_me_button2");
        try_me_button2.addEventListener("click", () => {
            alert("Message generated by an ARROW function.");
        })

    </script>
</body>

</html>
