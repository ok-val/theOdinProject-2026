<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        :root {
            --container-width: 280px;
            --btn-height: 40px;
            font-size: 20px;
        }

        .container {
            width: var(--container-width);
            background-color: antiquewhite;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .controls {
            display: flex;
            flex-direction: row;
        }

        .operators {
            display: flex;
            flex-direction: column;
        }

        .numbers {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            flex: 1;
        }

        .numbers button {
            width: calc(100% / 3);
        }

        #display {
            background: rgb(200, 229, 200);
            display: block;
            height: var(--btn-height);
            width: auto;
            box-sizing: border-box;
            padding: 0 8px;
            line-height: var(--btn-height);
            text-align: right;
        }

        button {
            width: calc(var(--container-width) / 4);
            height: var(--btn-height);
            font-size: inherit;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        button#equal {
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="display">

        </div>
        <div class="controls">
            <div class="operators">
                <button id="multiply">*</button>
                <button id="subtract">-</button>
                <button id="add">+</button>
                <button id="divide">/</button>
            </div>
            <div class="numbers">
                <button id="number">7</button>
                <button id="number">8</button>
                <button id="number">9</button>
                <button id="number">4</button>
                <button id="number">5</button>
                <button id="number">6</button>
                <button id="number">1</button>
                <button id="number">2</button>
                <button id="number">3</button>
                <button id="dot">.</button>
                <button id="number">0</button>
                <button id="del">del</button>
            </div>
        </div>
        <button id="equal">=</button>
    </div>

    <script>
        const numbersButtons = document.querySelectorAll('.numbers #number');
        const operatorButtons = document.querySelectorAll('.operators button');
        const equalButton = document.querySelector('#equal');
        const deleteButton = document.querySelector('#del');
        const dotButton = document.querySelector('#dot');

        let n1;
        let op;
        let n2;
        let res;

        let isN1Assigned = false;
        let isN2Assigned = false;
        let isOpToggled = false;
        let isResToggled = false;

        const operations = {
            'add': (a, b) => +a + +b,
            'subtract': (a, b) => +a - +b,
            'multiply': (a, b) => +a * +b,
            'divide': (a, b) => +a / +b,
        }

        function calculateAndDisplay(display) {
            res = operations[op](n1, n2);
            console.log(n1, n2);
            n1 = res;
            display.textContent = res;
        }


        equalButton.addEventListener('click', () => {
            const display = document.querySelector('#display');
            if (isN1Assigned && !isN2Assigned && !isOpToggled) {
                n2 = parseFloat(display.textContent);
                isN2Assigned = true;
                calculateAndDisplay(display);
                console.log('eq1');
            } else if (isN1Assigned && isN2Assigned && isOpToggled) {
                calculateAndDisplay(display);
                console.log('eq2');
            } else if (isN1Assigned && isN2Assigned && !isOpToggled && !isResToggled) {
                n2 = parseFloat(display.textContent);
                calculateAndDisplay(display);
                console.log('eq3');
            } else if (isN1Assigned && isN2Assigned && isOpToggled && !isResToggled) {
                console.log('eq4');
            } else if (isN1Assigned && isN2Assigned && !isOpToggled && isResToggled) {
                console.log('eq5');
            }
            isResToggled = true;
        });



        for (let button of operatorButtons) {
            const display = document.querySelector('#display');

            button.addEventListener('click', () => {
                if (!isN1Assigned && Boolean(display.textContent.trim())) {
                    n1 = parseFloat(display.textContent);
                    isN1Assigned = true;
                } else if (isN1Assigned && !isN2Assigned && Boolean(display.textContent.trim())) {
                    n2 = parseFloat(display.textContent);
                    isN2Assigned = true;
                    calculateAndDisplay(display);
                    console.log('op1');

                } else if (isN1Assigned && isN2Assigned && !isOpToggled && !isResToggled) {
                    n2 = parseFloat(display.textContent);
                    calculateAndDisplay(display);
                    console.log('op2');
                } else if (isN1Assigned && isN2Assigned && isOpToggled && isResToggled) {
                    console.log('op3');
                } else if (isN1Assigned && isN2Assigned && !isOpToggled && isResToggled) {
                    console.log('op4');
                }
                op = button.id;
                isOpToggled = true;
            }
            );
        }

        for (let button of numbersButtons) {
            const display = document.querySelector('#display');
            button.addEventListener('click', () => {
                if (isOpToggled) {
                    display.textContent = '';
                    isOpToggled = false;
                } else if (isResToggled) {
                    display.textContent = '';
                    n1 = undefined;
                    n2 = undefined;
                    isN1Assigned = false;
                    isN2Assigned = false;
                    console.log('reset');
                }
                isResToggled = false;
                display.textContent += button.textContent;
            });
        }

        deleteButton.addEventListener('click', () => {
            const display = document.querySelector('#display');
            if (display.textContent.trim()) {
                let text = display.textContent.trim().split('');
                text.splice(-1, 1);
                display.textContent = text.join('');
            }
        })

        dotButton.addEventListener('click', () => {
            const display = document.querySelector('#display');
            if (isResToggled) {
                display.textContent = '';
                n1 = undefined;
                n2 = undefined;
                isN1Assigned = false;
                isN2Assigned = false;
                console.log('reset');
            }
            isResToggled = false;
            let text = display.textContent.trim();

            if (!text) {
                display.textContent = 0 + '.';
                console.log('dot1');
            } else if (text.includes('.') === false) {
                display.textContent += '.';
                console.log('dot2');
            }
        })
    </script>
</body>

</html>
