<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        :root {
            --container-width: 280px;
            font-size: 24px;
        }

        .container {
            width: var(--container-width);
            height: 200px;
            background-color: antiquewhite;
            display: flex;
            flex-direction: column;
        }

        .controls {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        #display {
            background: rgb(200, 229, 200);
            display: block;
            height: 50px;
            width: auto;
        }

        button {
            width: calc(var(--container-width) / 4);
            height: 50px;
            font-size: inherit;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="display">

        </div>
        <div class="operators">
            <button id="add">+</button>
            <button id="subtract">-</button>
            <button id="divide">/</button>
            <button id="multiply">*</button>
        </div>
        <div class="numbers">
            <button id="1">1</button>
            <button id="2">2</button>
            <button id="3">3</button>
            <button id="4">4</button>
            <button id="5">5</button>
            <button id="6">6</button>
            <button id="7">7</button>
            <button id="8">8</button>
            <button id="9">9</button>
            <button id="0">0</button>
            <button id="dot">.</button>
        </div>
        <button id="equal">=</button>
    </div>

    <script>
        const numbersButtons = document.querySelectorAll('.numbers button');
        const operatorButtons = document.querySelectorAll('.operators button');
        const equalButton = document.querySelector('#equal');

        let n1;
        let op;
        let n2;

        let isN1Assigned = false;
        let isOpSelected = false;

        const operations = {
            'add': (a, b) => +a + +b,
            'substract': (a, b) => +a - +b,
            'multiply': (a, b) => +a * +b,
            'divide': (a, b) => +a / +b,
        }

        equalButton.addEventListener('click', () => {
            const display = document.querySelector('#display');
            if (!isOpSelected) {
                if (!isN1Assigned) {
                    n1 = 0;
                    isN1Assigned = true;
                    display.textContent = n1;
                    console.log('reached1');
                } else {
                    display.textContent = n1;
                }
            } else {

            }
        });

        for (let button of operatorButtons) {
            const display = document.querySelector('#display');

            button.addEventListener('click', () => {
                if (!isOpSelected) {
                    if (!isN1Assigned) {
                        n1 = (display.textContent.trim()) ? +display.textContent : 0;
                        op = button.id;
                        isN1Assigned = true;
                        isOpSelected = true;
                    } else {
                        n2 = (display.textContent.trim()) ? +display.textContent : 0;
                        res = operations[op](n1, n2);
                        op = button.id;
                        n1 = res;
                        display.textContent = res;
                        isOpSelected = true;
                    }
                } else {
                    op = button.id;
                }
            });
        }

        for (let button of numbersButtons) {
            const display = document.querySelector('#display');

            button.addEventListener('click', () => {
                if (isOpSelected) {
                    display.textContent = '';
                    isOpSelected = false;
                }
                display.textContent += button.textContent;
            });
        }
    </script>
</body>

</html>
