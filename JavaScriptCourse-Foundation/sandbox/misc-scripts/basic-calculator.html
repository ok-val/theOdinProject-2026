<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        :root {
            --container-width: 280px;
            font-size: 24px;
        }

        .container {
            width: var(--container-width);
            height: 200px;
            background-color: antiquewhite;
            display: flex;
            flex-direction: column;
        }

        .controls {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        #display {
            background: rgb(200, 229, 200);
            display: block;
            height: 50px;
            width: auto;
        }

        button {
            width: calc(var(--container-width) / 4);
            height: 50px;
            font-size: inherit;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="display">

        </div>
        <div class="operators">
            <button id="add">+</button>
            <button id="subtract">-</button>
            <button id="divide">/</button>
            <button id="multiply">*</button>
        </div>
        <div class="numbers">
            <button id="1">1</button>
            <button id="2">2</button>
            <button id="3">3</button>
            <button id="4">4</button>
            <button id="5">5</button>
            <button id="6">6</button>
            <button id="7">7</button>
            <button id="8">8</button>
            <button id="9">9</button>
            <button id="0">0</button>
        </div>
        <button id="dot">.</button>
        <button id="equal">=</button>
    </div>

    <script>
        const numbersButtons = document.querySelectorAll('.numbers button');
        const operatorButtons = document.querySelectorAll('.operators button');
        const equalButton = document.querySelector('#equal');

        let n1;
        let op;
        let n2;
        let res;

        let isN1Assigned = false;
        let isN2Assigned = false;
        let isOpToggled = false;

        const operations = {
            'add': (a, b) => +a + +b,
            'subtract': (a, b) => +a - +b,
            'multiply': (a, b) => +a * +b,
            'divide': (a, b) => +a / +b,
        }

        function calculateAndDisplay(display) {
            res = operations[op](n1, n2);
            console.log(n1, n2);
            n1 = res;
            display.textContent = res;
        }

        function checkVars() {
            console.log(n1);
            console.log(op);
            console.log(n2);
        }

        equalButton.addEventListener('click', () => {
            const display = document.querySelector('#display');
            if (!isN1Assigned && Boolean(display.textContent.trim())) {
                n1 = parseFloat(display.textContent);
                isN1Assigned = true;
            } else if (isN1Assigned && !isN2Assigned && Boolean(display.textContent.trim())) {
                n2 = parseFloat(display.textContent);
                isN2Assigned = true;
                calculateAndDisplay(display);
            } else if (isN1Assigned && isN2Assigned && isOpToggled) {
                n2 = parseFloat(display.textContent);
                calculateAndDisplay(display);
            } else if (isN1Assigned && isN2Assigned && !isOpToggled) {
                calculateAndDisplay(display);
            }
        });



        for (let button of operatorButtons) {
            const display = document.querySelector('#display');
            
            button.addEventListener('click', () => {
                if (!isN1Assigned && Boolean(display.textContent.trim())) {
                    n1 = parseFloat(display.textContent);
                    isN1Assigned = true;
                } else if (isN1Assigned && !isN2Assigned && Boolean(display.textContent.trim())) {
                    n2 = parseFloat(display.textContent);
                    isN2Assigned = true;
                    calculateAndDisplay(display);
                    console.log('echo1');
                } else if (isN1Assigned && isN2Assigned && !isOpToggled) {
                    n2 = parseFloat(display.textContent);
                    calculateAndDisplay(display);
                    console.log('echo2');
                } else if (isN1Assigned && isN2Assigned && isOpToggled) {
                    // calculateAndDisplay(display);
                    console.log('echo3');
                }
                op = button.id;
                isOpToggled = true;
            }
            );
        }

        for (let button of numbersButtons) {
            const display = document.querySelector('#display');
            button.addEventListener('click', () => {
                if (isOpToggled) {
                    display.textContent = '';
                    isOpToggled = false;
                }
                display.textContent += button.textContent;
            });
        }
    </script>
</body>

</html>
