<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copying Arrays</title>
</head>

<body>
    <script>
        let fruits = ['a', 'b', 'c'];
        let cart = fruits;
        console.log(fruits == cart);
        fruits.push('d');
        console.log(cart);
        // we are working with the SAME OBJECT here
    </script>
    <script>
        let cart1 = fruits.concat();
        console.log(fruits == cart1);
        
        let cart2 = fruits.slice(0);
        console.log(fruits == cart2);
        // now we have two different objects to work with
    </script>
</body>

</html>
