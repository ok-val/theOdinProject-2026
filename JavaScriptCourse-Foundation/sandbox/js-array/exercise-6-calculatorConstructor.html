        let calc = new Calculator; // if the object above is used, returns Calculator is not a constructor... and I don't know how to create a constructor

        // This is how you would create a Function Constructor 
        function Calculator() {
            this.methods = {
                '+': (a, b) => a + b,
                '-': (a, b) => a - b,
            };
            this.calculate = (str) => {
                const parts = str.split(' ');
                const a = +parts[0];
                const op = parts[1];
                const b = +parts[2];

                return this.methods[op](a, b);
            };
            this.addMethod = (str, fn) => {
                this.methods[str] = fn;
            };
        }


        console.log(calc.calculate("3 + 7")); // 10
        calc.addMethod("*", (a, b) => a * b);
