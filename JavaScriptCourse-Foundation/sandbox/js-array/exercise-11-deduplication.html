        let strings = ["Hare", "Krishna", "Hare", "Krishna",

        ];


        // Alright, I'm sure there is some idiomatic way using filter(fn),
        // But first Imma do this python style

        function unique1(arr) {
            let uniqueArr = [];
            for (const a of arr) {
                if (!uniqueArr.includes(a)) {
                    uniqueArr.push(a);
                } else uniqueArr.splice(uniqueArr.indexOf(a), 1);
            };
            return uniqueArr;
        }
