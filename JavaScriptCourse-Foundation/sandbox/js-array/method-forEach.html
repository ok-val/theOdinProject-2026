<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forEach method</title>
</head>
<body>
    <script>
        /**
         * Alright here comes camelCase shennanigans
         * The FOREACH method run a function for every elements in the array
        */

        let arr = ['a', 'b', 'c'];

        arr.forEach((item, index, array) => {
            alert(`${item} is at index ${index} in ${array}.`);
        });

        // This is quite cool

    </script>
</body>
</html>
