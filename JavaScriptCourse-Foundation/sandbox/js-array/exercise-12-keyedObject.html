<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create keyed object from array</title>
</head>

<body>
    <script>
        /**
         * Let’s say we received an array of users in object form {id:..., name:..., age:... }.
         * Create a function groupById(arr) that creates an object from it, with id as the key, and array items as values.
        */

        let users = [
            { id: 'john', name: "John Smith", age: 20 },
            { id: 'ann', name: "Ann Smith", age: 24 },
            { id: 'pete', name: "Pete Peterson", age: 31 },
        ];


        function groupById1(arr) {
            let res = {};
            for (const a of arr) {
                res[a.id] = a; 
            }
            return res;
        }


        // Since the exercise required us to do this using reduce, let's reduce

        function groupById(arr) {
            return arr.reduce(
                (accumulator, currentVal) => {                  // for each currentVal
                    accumulator[currentVal.id] = currentVal;    // create an object
                    return accumulator},                        // return that object to accumulate
                {},                                             // provide an outer object to boot
            )
        }

        let usersById = groupById(users);



    </script>
</body>

</html>
