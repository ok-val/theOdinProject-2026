<body>
    <script>
        /* SPLICE is like a swiss army knife!
        Because it can be everything! 
        
        SPLICE takes: 
        * 1 positional arg as 'start'
        * 1 optional-positional arg as 'deleteCount'
        * and infinite optional args as 'insertElem'
        */

        let arr = ['a1', 'a2', 'a3'];

        /*
        
        arr.splice(1, 1); // from index 1 remove 1

        arr.splice(0, 3, "Let's", "dance"); // from 0 remove 3, insert "Let's", "dance"

        let spliced = arr.splice(0, 3) // from 0 in arr remove 3, assign to spliced list
        
        arr.splice((arr.length - 1), 0, "Let's", "add") // from last index remove 0, insert "Let's", "add"

        arr.splice(-1, 0, "Let's", "add") // negative index allowed

        */

        /* 
        
        If we recall push/pop/shift/unshift, these methods only allowed deletion and insertion at either the head or tail of an array, 
        
        But splice allows us to insert and delete elements from anywhere within the array, this is where array is most useful. 
        
        THERE'S NO NEED TO CALL A COMPLEX FUNCTION TO DO A SIMPLE TASK. Priority push/pop/shift for simpler tasks, it's easier to maintain and debug. 
        
        */



    </script>
