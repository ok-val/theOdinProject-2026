<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descending Sort</title>
</head>

<body>
    <script>
        let arr = [5, 2, 1, -10, 8];
        arr.sort((a, b) => b - a);
        console.log(arr);

    </script>

    <script>
        let arr1 = ["HTML", "JavaScript", "CSS"];

        function copySorted(arr) {
            return arr.slice().sort();
        }

        console.log(arr1);
        console.log(copySorted(arr1));

    </script>
</body>

</html>
