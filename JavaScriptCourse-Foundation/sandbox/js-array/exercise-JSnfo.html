    <script>
        function sumInput() {
            let ints = [];
            while (true) {
                let int = prompt('Input value to sum:', '');
                // if (int == null || isNaN(int) || int.trim() === '') break;
                if (int == null || !isFinite(int) || int.trim() === '') break;
                ints.push(int);
            };
            return listSum(ints);
        }
        function listSum(list) {
            let sum = 0;
            for (const l of list) {
                sum += Number(l);
            }
            return sum;
        }
    </script>
